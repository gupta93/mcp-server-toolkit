[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-toolkit"
version = "0.1.0"
description = "Production-style MCP server demo with GitHub, SQL, and OpenAPI tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tushar Gupta", email = "tushar.gp.93@gmail.com" }]
dependencies = [
  "httpx>=0.28",
  "mcp>=2.0,<3",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "structlog>=24.4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.22",
  "ruff>=0.8",
]

[project.scripts]
mcp-server-toolkit = "mcp_server_toolkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_toolkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = []
